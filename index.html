<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanegal Katalog 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;font-family:'Outfit',sans-serif;height:100vh;overflow:hidden;color:#eee}
.topbar{position:fixed;top:0;left:0;right:0;height:50px;background:rgba(5,5,5,0.95);border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.brand-logo{display:flex;align-items:center}
.page-info{font-size:11px;color:#555;letter-spacing:2px}
.stage{width:100vw;min-height:100vh;display:flex;align-items:center;justify-content:center;padding-top:50px;padding-bottom:70px}
.book{display:flex;width:900px;height:620px;box-shadow:0 40px 100px rgba(0,0,0,0.9)}
@media(max-width:700px){
  body{overflow:hidden}
  .stage{padding:0;align-items:stretch;height:100vh}
  .book{display:none}
  .nav{display:none}
  /* MOBİL LAYOUT */
  .mobile-view{display:flex !important}
}
.mobile-view{
  display:none;
  position:fixed;
  inset:0;
  flex-direction:column;
  background:#0a0a0a;
  overflow:hidden;
  touch-action:pan-y;
}
.mob-header{
  height:50px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:rgba(5,5,5,0.95);
  border-bottom:1px solid #1a1a1a;
}
.mob-brand-name{font-family:'Bebas Neue';font-size:18px;letter-spacing:3px;color:#E8C84A}
.mob-counter{font-size:10px;color:#555;letter-spacing:1px}
.mob-cover{
  flex-shrink:0;
  height:130px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:16px;
  transition:background .3s;
}
.mob-cover-text{z-index:1}
.mob-cover-title{font-family:'Bebas Neue';font-size:42px;letter-spacing:4px;color:#fff;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,0.5)}
.mob-cover-sub{font-size:9px;letter-spacing:2px;opacity:0.5;color:#fff;margin-top:2px}
.mob-cover-count{font-size:10px;color:#fff;opacity:0.7;margin-top:6px;letter-spacing:1px}
.mob-cover-deco{position:absolute;right:-30px;bottom:-30px;width:160px;height:160px;border-radius:50%;opacity:0.08;border:25px solid #fff}
.mob-logo{height:38px;width:auto;margin-left:auto;z-index:1;filter:brightness(0) invert(1);opacity:0.7;flex-shrink:0}
.mob-grid-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px}
.mob-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mob-card{
  aspect-ratio:1/1;
  position:relative;
  background:#fff;
  border-radius:8px;
  overflow:hidden;
  cursor:pointer;
  border:2px dashed #ddd;
  transition:border-color .15s;
  -webkit-tap-highlight-color:transparent;
}
.mob-card:active{transform:scale(0.97)}
.mob-card img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;visibility:hidden}
.mob-card .mob-lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.55);padding:4px 6px;display:flex;align-items:baseline;justify-content:space-between}
.mob-card .mob-code{font-family:'Bebas Neue';font-size:13px;color:#fff;letter-spacing:1px}
.mob-card .mob-inch{font-size:8px;color:#ccc;letter-spacing:1px}
.mob-card .mob-add-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#bbb;letter-spacing:1px;font-family:'Bebas Neue'}
.mob-add-card{aspect-ratio:1/1;background:#0d0d0d;border:2px dashed #333;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:12px;letter-spacing:2px;color:#444;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mob-add-card:active{border-color:#E8C84A;color:#E8C84A}
.mob-nav{
  flex-shrink:0;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:rgba(5,5,5,0.95);
  border-top:1px solid #1a1a1a;
  gap:8px;
}
.mob-nav-btn{
  width:40px;height:40px;border-radius:50%;
  border:1px solid #2a2a2a;background:rgba(20,20,20,0.9);
  color:#bbb;font-size:18px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent;
}
.mob-nav-btn:active{background:#E8C84A;color:#111}
.mob-nav-btn:disabled{opacity:0.2}
.mob-dots-wrap{flex:1;overflow-x:auto;display:flex;align-items:center;gap:5px;padding:0 4px;scrollbar-width:none}
.mob-dots-wrap::-webkit-scrollbar{display:none}
.mob-dot{width:7px;height:7px;border-radius:50%;background:#222;border:1px solid #333;flex-shrink:0;cursor:pointer;transition:all .2s}
.mob-dot.active{background:#E8C84A;border-color:#E8C84A;transform:scale(1.3)}
.mob-swipe-hint{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);font-size:9px;color:#333;letter-spacing:2px;pointer-events:none;opacity:0;animation:fadeHint 3s ease forwards}
@keyframes fadeHint{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* SOL SAYFA - KAPAK */
.brand-cover{width:360px;height:620px;flex-shrink:0;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;gap:16px}
.cover-circle{position:absolute;border-radius:50%;opacity:0.06}
.cover-label{font-size:10px;letter-spacing:4px;opacity:0.6;z-index:1}
.cover-brand{font-family:'Bebas Neue';letter-spacing:6px;line-height:1;text-align:center;z-index:1;text-shadow:0 4px 24px rgba(0,0,0,0.5)}
.cover-sub{font-size:11px;letter-spacing:2px;opacity:0.5;z-index:1;text-align:center}
.cover-count{font-size:11px;padding:6px 16px;border:1px solid currentColor;border-radius:2px;opacity:0.7;letter-spacing:2px;z-index:1}
.cover-accent{position:absolute;bottom:0;left:0;right:0;height:4px}
.gutter{width:4px;height:620px;flex-shrink:0;background:linear-gradient(to right,#000,#1a1a1a,#000)}

/* SAG SAYFA - URUNLER */
.prod-page{width:536px;height:620px;flex-shrink:0;background:#111;display:flex;flex-direction:column;overflow:hidden}
.prod-header{padding:12px 14px 8px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.prod-header h3{font-family:'Bebas Neue';font-size:17px;letter-spacing:3px;color:#ddd}
.prod-badge{font-size:9px;letter-spacing:2px;padding:3px 10px;border-radius:2px;font-weight:700}

/* URUN GRID */
.prod-grid{flex:1;overflow-y:auto;padding:8px;display:grid;gap:6px;align-content:start}
.prod-grid::-webkit-scrollbar{width:3px}
.prod-grid::-webkit-scrollbar-thumb{background:#333}

/* URUN KART - aspect-ratio:1 grid item uzerinde calısır! */
.prod-card{
  position:relative;
  background:#fff;
  border-radius:5px;
  overflow:hidden;
  cursor:pointer;
  border:2px dashed #ddd;
  transition:border-color .2s,transform .2s;
}
.prod-card:hover{border-color:#E8C84A;transform:scale(1.04);z-index:5}
.prod-card:hover .upload-hint{opacity:1}
.prod-card img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;visibility:hidden}
.upload-hint{position:absolute;inset:0;background:rgba(232,200,74,0.2);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;font-size:10px;color:#996600;letter-spacing:1px;font-weight:700}
.prod-card .lbl{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,0.55);padding:2px 6px;border-radius:3px;text-align:right}
.prod-card .lbl .code{font-family:'Bebas Neue';font-size:11px;letter-spacing:1px;color:#fff;display:block;line-height:1.2;cursor:text}
.prod-card .lbl .inch{font-size:7px;color:#ddd;letter-spacing:1px;line-height:1.2;cursor:text}

.prod-footer{padding:5px 14px;border-top:1px solid #141414;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.prod-footer .total{font-size:9px;color:#444;letter-spacing:2px}
.prod-footer .logo{font-family:'Bebas Neue';font-size:11px;letter-spacing:3px;color:#1a1a1a}

/* NAV */
.nav{position:fixed;bottom:14px;display:flex;gap:8px;align-items:center;z-index:100}
.nav-btn{width:40px;height:40px;border-radius:50%;border:1px solid #2a2a2a;background:rgba(0,0,0,0.9);cursor:pointer;color:#bbb;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:15px}
.nav-btn:hover:not(:disabled){border-color:#E8C84A;color:#E8C84A}
.nav-btn:disabled{opacity:0.2;cursor:not-allowed}
.nav-dots{display:flex;gap:4px;align-items:center;flex-wrap:wrap;max-width:220px;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:#222;cursor:pointer;transition:all .2s;border:1px solid #333}
.dot.active{background:#E8C84A;border-color:#E8C84A;transform:scale(1.3)}
.progress-bar{position:fixed;bottom:0;left:0;height:2px;background:#E8C84A;transition:width .4s;z-index:200}
.drag-over{border-color:#E8C84A !important;background:#1a1500 !important}
.prod-card.dragging{opacity:0.4;transform:scale(0.95)}
.add-card{background:#0d0d0d;border:2px dashed #444;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s,background .2s;color:#555;font-family:'Bebas Neue';font-size:13px;letter-spacing:2px}
.add-card:hover{border-color:#E8C84A;background:#111;color:#E8C84A}
.add-page-btn{width:32px;height:32px;border-radius:50%;border:1px dashed #444;background:transparent;cursor:pointer;color:#555;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.add-page-btn:hover{border-color:#E8C84A;color:#E8C84A}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;display:none;align-items:center;justify-content:center}
.img-edit-bg{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:600;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.img-edit-bg.open{display:flex}
.img-edit-frame{position:relative;width:300px;height:300px;overflow:hidden;border:2px solid #E8C84A;border-radius:6px;cursor:grab;background:#111;touch-action:none}
.img-edit-frame:active{cursor:grabbing}
.img-edit-frame img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform-origin:center;pointer-events:none;user-select:none}
.img-edit-controls{display:flex;flex-direction:column;align-items:center;gap:10px;width:300px}
.img-edit-label{font-size:10px;color:#888;letter-spacing:2px;text-align:center}
.zoom-row{display:flex;align-items:center;gap:10px;width:100%}
.zoom-btn{width:32px;height:32px;border-radius:50%;border:1px solid #333;background:#1a1a1a;color:#E8C84A;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.zoom-btn:active{background:#E8C84A;color:#111}
input[type=range].zoom-slider{flex:1;accent-color:#E8C84A;height:4px}
.img-edit-btns{display:flex;gap:8px}
.img-edit-btns button{padding:8px 20px;border-radius:4px;border:none;cursor:pointer;font-family:'Bebas Neue';font-size:14px;letter-spacing:2px}
.edit-save{background:#E8C84A;color:#111}
.edit-cancel{background:#333;color:#aaa}
.edit-reset{background:#1a1a1a;color:#666;border:1px solid #333 !important}
.edit-trigger{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:rgba(232,200,74,0.9);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;z-index:3;opacity:0;transition:opacity .2s}
.prod-card:hover .edit-trigger{opacity:1}
.mob-card .edit-trigger{opacity:0.7}
/* Düzenleme kapalı modu */
body.view-mode .edit-trigger{display:none !important}
body.view-mode .add-card{display:none !important}
body.view-mode .mob-add-card{display:none !important}
body.view-mode .add-page-btn{display:none !important}
body.view-mode .prod-card{cursor:default !important}
body.view-mode .mob-card{cursor:default !important}
body.view-mode .prod-card .lbl .code{cursor:default !important}
body.view-mode .prod-card .lbl .inch{cursor:default !important}
body.view-mode .prod-card:hover{transform:none !important;border-color:#ddd !important}
body.view-mode .mob-card:active{transform:none !important}
.edit-mode-badge{position:fixed;bottom:70px;right:16px;background:#E8C84A;color:#111;font-family:'Bebas Neue';font-size:11px;letter-spacing:2px;padding:4px 10px;border-radius:3px;z-index:300;display:none}
body.edit-mode .edit-mode-badge{display:block}
.modal-bg.open{display:flex}
.modal{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:24px;min-width:280px;display:flex;flex-direction:column;gap:12px}
.modal h4{font-family:'Bebas Neue';font-size:18px;letter-spacing:3px;color:#E8C84A}
.modal input{background:#0d0d0d;border:1px solid #333;border-radius:4px;padding:8px 10px;color:#eee;font-family:'Outfit',sans-serif;font-size:13px;outline:none;width:100%}
.modal input:focus{border-color:#E8C84A}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btns button{padding:7px 18px;border-radius:4px;border:none;cursor:pointer;font-family:'Bebas Neue';font-size:14px;letter-spacing:2px}
.modal-ok{background:#E8C84A;color:#111}
.modal-cancel{background:#333;color:#aaa}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0);pointer-events:none;transition:background .15s;z-index:30}
.overlay.on{background:rgba(0,0,0,0.3)}
</style>
</head>
<body>
<div class="edit-mode-badge">✎ DÜZENLEME MODU</div>
<div class="img-edit-bg" id="imgEditBg">
  <div class="img-edit-label">GÖRSELİ KONUMLANDIR VE YAKLAŞTIR</div>
  <div class="img-edit-frame" id="imgEditFrame">
    <img id="imgEditImg" src="" alt="">
  </div>
  <div class="img-edit-controls">
    <div class="zoom-row">
      <button class="zoom-btn" onclick="imgEditZoom(-0.1)">&#8722;</button>
      <input type="range" class="zoom-slider" id="zoomSlider" min="0.5" max="3" step="0.05" value="1">
      <button class="zoom-btn" onclick="imgEditZoom(0.1)">&#43;</button>
    </div>
    <div class="img-edit-label" id="imgEditHint">Sürükle: konumlandır • Kaydır: zoom</div>
  </div>
  <div class="img-edit-btns">
    <button class="edit-btns edit-cancel" onclick="closeImgEdit()">İPTAL</button>
    <button class="edit-btns edit-reset" onclick="resetImgEdit()">SIFIRLA</button>
    <button class="edit-btns edit-save" onclick="saveImgEdit()">KAYDET</button>
  </div>
</div>
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h4 id="modalTitle">YENİ ÜRÜN</h4>
    <input id="modalInput1" placeholder="Ürün kodu" />
    <input id="modalInput2" placeholder="İnç (örn: 14)" />
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">İPTAL</button>
      <button class="modal-ok" id="modalOkBtn">EKLE</button>
    </div>
  </div>
</div>

// Modal sistemi
function openModal(title, placeholder1, placeholder2, onOk) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalInput1').value = '';
  document.getElementById('modalInput1').placeholder = placeholder1;
  document.getElementById('modalInput2').value = '';
  document.getElementById('modalInput2').placeholder = placeholder2;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('modalInput1').focus();
  document.getElementById('modalOkBtn').onclick = function() {
    const v1 = document.getElementById('modalInput1').value;
    const v2 = document.getElementById('modalInput2').value;
    closeModal();
    onOk(v1, v2);
  };
  document.getElementById('modalInput2').onkeydown = function(e) {
    if(e.key === 'Enter') document.getElementById('modalOkBtn').click();
  };
  document.getElementById('modalInput1').onkeydown = function(e) {
    if(e.key === 'Enter') document.getElementById('modalInput2').focus();
  };
}
function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
}
document.getElementById('modalBg').addEventListener('click', function(e) {
  if(e.target === this) closeModal();
});

  const isUni = b.name === 'UNIVERSAL' || b.name === 'SİYAH';
  document.getElementById('prodTitle').textContent = b.name + (isUni ? ' GRUBU' : ' UYUMLU');
  const badge = document.getElementById('prodBadge');
  badge.textContent = b.name;
  badge.style.background = isBlack ? '#333' : b.color;
  badge.style.color = isYellow ? '#111' : '#fff';

  const grid = document.getElementById('prodGrid');
  grid.innerHTML = '';
  grid.scrollTop = 0;
  const cols = b.products.length > 18 ? 4 : 3;
  // Ekran genişliğine göre hücre boyutu hesapla
  const isMobile = window.innerWidth <= 700;
  let cellSize;
  if (isMobile) {
    const gridW = window.innerWidth - 16; // 8px padding her taraf
    cellSize = Math.floor((gridW - 6 * (cols - 1)) / cols);
  } else {
    cellSize = cols === 4 ? 125 : 169;
  }
  grid.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
  grid.style.gridAutoRows = cellSize + 'px';

  // Kaydedilmiş sıralamayı yükle
  try {
    const savedOrder = JSON.parse(localStorage.getItem('order_' + b.name) || 'null');
    if (savedOrder && savedOrder.length > 0) {
      b.products.sort((a, b) => {
        const ia = savedOrder.indexOf(a.code);
        const ib = savedOrder.indexOf(b.code);
        return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
      });
    }
  } catch(e){}

  // localStorage'dan ekstra ürünleri yükle
  try {
    const extraKey = 'extra_prods_' + b.name;
    const extra = JSON.parse(localStorage.getItem(extraKey) || '[]');
    extra.forEach(ep => {
      if (!b.products.find(p => p.code === ep.code)) b.products.push(ep);
    });
  } catch(e){}

  b.products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'prod-card';
    card.dataset.code = p.code;

    const hint = document.createElement('div');
    hint.className = 'upload-hint';
    hint.textContent = 'GÖRSEL EKLE';
    card.appendChild(hint);

    const img = document.createElement('img');
    img.alt = p.code;
    const saved = localStorage.getItem('img_' + b.name + '_' + p.code);
    img.dataset.editCode = b.name + '_' + p.code;
    if (saved) {
      img.src = saved;
      img.style.visibility = 'visible';
      hint.style.display = 'none';
      // Kaydedilmiş transform uygula
      try {
        const tr = JSON.parse(localStorage.getItem('transform_' + b.name + '_' + p.code) || 'null');
        if (tr) { img.style.transform = `translate(${tr.x}px,${tr.y}px) scale(${tr.scale})`; img.style.transformOrigin='center'; }
      } catch(e){}
    }
    card.appendChild(img);

    // Düzenleme butonu (görsel varsa göster)
    if (saved) {
      const editBtn = document.createElement('button');
      editBtn.className = 'edit-trigger';
      editBtn.title = 'Görseli düzenle';
      editBtn.innerHTML = '&#9881;';
      editBtn.addEventListener('click', ev => {
        ev.stopPropagation();
        if (!editMode) return;
        openImgEdit(b.name, p.code, saved);
      });
      card.appendChild(editBtn);
    }

    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    // Kaydedilmiş kod varsa onu kullan
    const savedCode = localStorage.getItem('code_' + b.name + '_' + p.code) || p.code;
    const savedInch = localStorage.getItem('inch_' + b.name + '_' + p.code) || p.inch;
    lbl.innerHTML = `<span class="code" title="Düzenlemek için tıkla">${savedCode}</span><span class="inch">${savedInch}"</span>`;
    card.appendChild(lbl);

    // Koda tıklayınca düzenle
    lbl.querySelector('.code').addEventListener('click', function(e) {
      e.stopPropagation();
      if (!editMode) return;
      const span = this;
      const current = span.textContent;
      const input = document.createElement('input');
      input.value = current;
      input.style.cssText = 'width:100%;background:rgba(0,0,0,0.8);color:#fff;border:1px solid #E8C84A;border-radius:2px;font-family:Bebas Neue,sans-serif;font-size:11px;letter-spacing:1px;text-align:right;padding:0 2px;outline:none';
      span.replaceWith(input);
      input.focus();
      input.select();
      let codeSaved = false;
      function save() {
        if(codeSaved) return; codeSaved = true;
        const val = input.value.trim() || current;
        const newSpan = document.createElement('span');
        newSpan.className = 'code';
        newSpan.title = 'Düzenlemek için tıkla';
        newSpan.textContent = val;
        if(input.parentNode) input.replaceWith(newSpan);
        try { localStorage.setItem('code_' + b.name + '_' + p.code, val); } catch(err){}
      }
      input.addEventListener('blur', save);
      input.addEventListener('keydown', function(e) {
        if(e.key === 'Enter') { e.preventDefault(); save(); }
        if(e.key === 'Escape') { input.value = current; save(); }
      });
    });

    // İnç'e tıklayınca düzenle
    lbl.querySelector('.inch').addEventListener('click', function(e) {
      e.stopPropagation();
      if (!editMode) return;
      const span = this;
      const current = span.textContent.replace('"','').trim();
      const input = document.createElement('input');
      input.value = current;
      input.style.cssText = 'width:100%;background:rgba(0,0,0,0.8);color:#ddd;border:1px solid #E8C84A;border-radius:2px;font-size:7px;letter-spacing:1px;text-align:right;padding:0 2px;outline:none';
      span.replaceWith(input);
      input.focus();
      input.select();
      let inchSaved = false;
      function saveInch() {
        if(inchSaved) return; inchSaved = true;
        const val = input.value.trim() || current;
        const newSpan = document.createElement('span');
        newSpan.className = 'inch';
        newSpan.title = 'Düzenlemek için tıkla';
        newSpan.textContent = val + '"';
        if(input.parentNode) input.replaceWith(newSpan);
        try { localStorage.setItem('inch_' + b.name + '_' + p.code, val); } catch(err){}
      }
      input.addEventListener('blur', saveInch);
      input.addEventListener('keydown', function(e) {
        if(e.key === 'Enter') { e.preventDefault(); saveInch(); }
        if(e.key === 'Escape') { input.value = current; saveInch(); }
      });
    });

    card.addEventListener('click', () => {
      if (!editMode) return;
      const picker = document.getElementById('imgPicker');
      picker.onchange = () => {
        const file = picker.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
          img.src = e.target.result;
          img.style.visibility = 'visible';
          hint.style.display = 'none';
          try { localStorage.setItem('img_' + b.name + '_' + p.code, e.target.result); } catch(err) {}
        };
        reader.readAsDataURL(file);
        picker.value = '';
      };
      picker.click();
    });

    // Sürükle-bırak
    card.draggable = true;
    card.addEventListener('dragstart', function(e) {
      if (!editMode) { e.preventDefault(); return; }
      e.dataTransfer.setData('text/plain', Array.from(grid.children).indexOf(card).toString());
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', function() {
      card.classList.remove('dragging');
      document.querySelectorAll('.prod-card').forEach(c => c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover', function(e) {
      e.preventDefault();
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', function() {
      card.classList.remove('drag-over');
    });
    card.addEventListener('drop', function(e) {
      e.preventDefault();
      card.classList.remove('drag-over');
      const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
      const toIdx = Array.from(grid.children).indexOf(card);
      if (fromIdx === toIdx || isNaN(fromIdx)) return;
      // Ürün dizisindeki sırayı değiştir
      const moved = b.products.splice(fromIdx, 1)[0];
      b.products.splice(toIdx, 0, moved);
      // localStorage'a kaydet
      try { localStorage.setItem('order_' + b.name, JSON.stringify(b.products.map(p => p.code))); } catch(e){}
      render(current);
    });

    grid.appendChild(card);
  });

  // + Yeni ürün kartı
  const addCard = document.createElement('div');
  addCard.className = 'add-card';
  addCard.textContent = '+ YENİ ÜRÜN';
  addCard.addEventListener('click', () => {
    if (!editMode) return;
    openModal(
      'YENİ ÜRÜN EKLE', 'Ürün kodu', 'İnç (örn: 14)',
      (code, inch) => {
        if (!code.trim()) return;
        const prod = {code: code.trim(), inch: parseInt(inch) || 14};
        b.products.push(prod);
        try {
          const key = 'extra_prods_' + b.name;
          const existing = JSON.parse(localStorage.getItem(key) || '[]');
          existing.push(prod);
          localStorage.setItem(key, JSON.stringify(existing));
        } catch(e){}
        render(current);
      }
    );
  });
  grid.appendChild(addCard);

  document.getElementById('prodTotal').textContent = b.products.length + ' ÜRÜN GÖSTERİLİYOR';
  document.getElementById('info').textContent = `${b.name} — ${idx+1} / ${total}`;
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === total - 1;
  document.getElementById('pb').style.width = ((idx/(total-1))*100) + '%';
  document.querySelectorAll('.dot').forEach((d,i) => {
    d.classList.toggle('active', i === idx);
    if(i !== idx) d.style.background = '#222';
  });
}

function go(dir) {
  const ov = document.getElementById('overlay');
  ov.classList.add('on');
  setTimeout(() => {
    current = Math.max(0, Math.min(total-1, current+dir));
    render(current);
    ov.classList.remove('on');
  }, 160);
}

const dotsEl = document.getElementById('dots');
BRANDS.forEach((b,i) => {
  const d = document.createElement('div');

// ============ DÜZENLEME MODU ============
let editMode = false;

function setEditMode(active) {
  editMode = active;
  if (active) {
    document.body.classList.remove('view-mode');
    document.body.classList.add('edit-mode');
  } else {
    document.body.classList.add('view-mode');
    document.body.classList.remove('edit-mode');
  }
  try { localStorage.setItem('editMode', active ? '1' : '0'); } catch(e) {}
}

// Başlangıçta view-mode (render öncesi sadece class ekle)
document.body.classList.add('view-mode');

// Ctrl+Shift+A ile düzenleme aç/kapat
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
    e.preventDefault();
    setEditMode(!editMode);
    render(current);
    if (typeof mobRender === 'function') mobRender(mobCurrent);
    if (editMode) {
      const badge = document.querySelector('.edit-mode-badge');

let tx = 0;
document.addEventListener('touchstart', e => tx = e.touches[0].clientX);
document.addEventListener('touchend', e => {

});

let mobCurrent = 0;

function mobGo(dir) {
  mobCurrent = Math.max(0, Math.min(BRANDS.length-1, mobCurrent+dir));
  mobRender(mobCurrent);
}

// Swipe
let mobTx = 0, mobTy = 0;
const mobileView = document.getElementById('mobileView');
mobileView.addEventListener('touchstart', e => {
  mobTx = e.touches[0].clientX;
  mobTy = e.touches[0].clientY;
}, {passive:true});
mobileView.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - mobTx;
  const dy = e.changedTouches[0].clientY - mobTy;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    if (dx < 0) mobGo(1);
    else mobGo(-1);
  }
}, {passive:true});

// Mobil dots oluştur
const mobDotsEl = document.getElementById('mobDots');
BRANDS.forEach((b,i) => {
  const d = document.createElement('div');
  d.className = 'mob-dot';
  d.title = b.name;
  d.onclick = () => { mobCurrent = i; mobRender(mobCurrent); };
  mobDotsEl.appendChild(d);
});

// Mobil/masaüstü toggle
function checkLayout() {
  const mobile = window.innerWidth <= 700;
  document.getElementById('mobileView').style.display = mobile ? 'flex' : 'none';
  if (mobile) mobRender(mobCurrent);
}
window.addEventListener('resize', checkLayout);
checkLayout();

// ============ GÖRSEL DÜZENLEME ============
let imgEditState = {scale:1, x:0, y:0, code:'', brandName:''};
let imgEditDrag = {active:false, startX:0, startY:0, startTx:0, startTy:0};
let imgEditPinch = {active:false, startDist:0, startScale:1};

function openImgEdit(brandName, code, imgSrc) {
  imgEditState = {
    scale: 1, x: 0, y: 0,
    code: code, brandName: brandName
  };
  // Kaydedilmiş transform varsa yükle
  try {
    const saved = JSON.parse(localStorage.getItem('transform_' + brandName + '_' + code) || 'null');
    if (saved) { imgEditState.scale = saved.scale; imgEditState.x = saved.x; imgEditState.y = saved.y; }
  } catch(e){}

  const img = document.getElementById('imgEditImg');
  img.src = imgSrc;
  document.getElementById('zoomSlider').value = imgEditState.scale;
  applyImgEditTransform();
  document.getElementById('imgEditBg').classList.add('open');
}

function closeImgEdit() {
  document.getElementById('imgEditBg').classList.remove('open');
}

function applyImgEditTransform() {
  const img = document.getElementById('imgEditImg');
  img.style.transform = `translate(${imgEditState.x}px, ${imgEditState.y}px) scale(${imgEditState.scale})`;
  document.getElementById('zoomSlider').value = imgEditState.scale;
}

function imgEditZoom(delta) {
  imgEditState.scale = Math.min(3, Math.max(0.5, imgEditState.scale + delta));
  applyImgEditTransform();
}

function resetImgEdit() {
  imgEditState.scale = 1; imgEditState.x = 0; imgEditState.y = 0;
  applyImgEditTransform();
}

function saveImgEdit() {
  try {
    localStorage.setItem('transform_' + imgEditState.brandName + '_' + imgEditState.code,
      JSON.stringify({scale:imgEditState.scale, x:imgEditState.x, y:imgEditState.y}));
  } catch(e){}
  // Tüm ilgili img elementlerine uygula
  document.querySelectorAll('[data-edit-code="' + imgEditState.brandName + '_' + imgEditState.code + '"]').forEach(img => {
    img.style.transform = `translate(${imgEditState.x}px, ${imgEditState.y}px) scale(${imgEditState.scale})`;
    img.style.transformOrigin = 'center';
  });
  closeImgEdit();
}

// Zoom slider
document.getElementById('zoomSlider').addEventListener('input', function() {
  imgEditState.scale = parseFloat(this.value);
  applyImgEditTransform();
});

// Mouse sürükle
const frame = document.getElementById('imgEditFrame');
frame.addEventListener('mousedown', e => {
  imgEditDrag = {active:true, startX:e.clientX, startY:e.clientY, startTx:imgEditState.x, startTy:imgEditState.y};
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!imgEditDrag.active) return;
  imgEditState.x = imgEditDrag.startTx + (e.clientX - imgEditDrag.startX);
  imgEditState.y = imgEditDrag.startTy + (e.clientY - imgEditDrag.startY);
  applyImgEditTransform();
});
window.addEventListener('mouseup', () => imgEditDrag.active = false);

// Mouse scroll zoom
frame.addEventListener('wheel', e => {
  e.preventDefault();
  imgEditState.scale = Math.min(3, Math.max(0.5, imgEditState.scale - e.deltaY * 0.001));
  applyImgEditTransform();
}, {passive:false});

// Touch sürükle & pinch
frame.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    imgEditDrag = {active:true, startX:e.touches[0].clientX, startY:e.touches[0].clientY, startTx:imgEditState.x, startTy:imgEditState.y};
    imgEditPinch.active = false;
  } else if (e.touches.length === 2) {
    imgEditDrag.active = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    imgEditPinch = {active:true, startDist:Math.hypot(dx,dy), startScale:imgEditState.scale};
  }
  e.preventDefault();
}, {passive:false});

frame.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && imgEditDrag.active) {
    imgEditState.x = imgEditDrag.startTx + (e.touches[0].clientX - imgEditDrag.startX);
    imgEditState.y = imgEditDrag.startTy + (e.touches[0].clientY - imgEditDrag.startY);
    applyImgEditTransform();
  } else if (e.touches.length === 2 && imgEditPinch.active) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    imgEditState.scale = Math.min(3, Math.max(0.5, imgEditPinch.startScale * (dist / imgEditPinch.startDist)));
    applyImgEditTransform();
  }
  e.preventDefault();
}, {passive:false});

frame.addEventListener('touchend', () => { imgEditDrag.active = false; imgEditPinch.active = false; });

</script>
